<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENSA Study Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #0F172A;
    color: #E2E8F0;
    min-height: 100vh;
    padding: 16px;
  }

  .container { max-width: 800px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 24px; padding: 20px 0; }
  .header h1 { font-size: 26px; font-weight: 800; color: #F8FAFC; letter-spacing: -0.5px; }
  .header p { color: #94A3B8; font-size: 14px; margin-top: 6px; }

  .tab-bar {
    display: flex; gap: 4px; margin-bottom: 20px;
    background: #1E293B; border-radius: 10px; padding: 4px;
  }
  .tab-btn {
    flex: 1; padding: 10px 8px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: all 0.2s; background: transparent; color: #94A3B8;
    font-family: inherit;
  }
  .tab-btn.active { background: #3B82F6; color: #fff; }

  /* Overview */
  .overview-card {
    display: block; width: 100%; text-align: left;
    border: 1px solid #334155; background: #1E293B; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
    transition: all 0.2s; font-family: inherit; color: inherit;
  }
  .overview-card-top { display: flex; justify-content: space-between; align-items: center; }
  .overview-lec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .overview-title { color: #F1F5F9; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .overview-arrow { color: #64748B; font-size: 20px; }
  .overview-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .overview-tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }

  .big-picture {
    margin-top: 24px; padding: 16px; background: #1E293B;
    border-radius: 10px; border: 1px solid #334155;
  }
  .big-picture-title { font-size: 14px; font-weight: 700; color: #F8FAFC; margin-bottom: 10px; }
  .big-picture-text { font-size: 13px; color: #94A3B8; line-height: 1.7; }

  /* Study Cards */
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%; padding: 12px 16px 12px 40px;
    background: #1E293B; border: 1px solid #334155; border-radius: 10px;
    color: #F1F5F9; font-size: 14px; outline: none; font-family: inherit;
  }
  .search-input::placeholder { color: #64748B; }
  .search-input:focus { border-color: #3B82F6; }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: #64748B; font-size: 16px; pointer-events: none;
  }

  .lecture-btn {
    width: 100%; text-align: left; border: 1px solid #334155;
    background: #1E293B; padding: 14px 16px; cursor: pointer;
    transition: all 0.15s; font-family: inherit; color: inherit;
    border-radius: 10px;
  }
  .lecture-btn.open { border-radius: 10px 10px 0 0; }
  .lecture-top { display: flex; justify-content: space-between; align-items: center; }
  .lecture-lec { font-size: 11px; font-weight: 700; }
  .lecture-title { color: #F1F5F9; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .lecture-right { display: flex; align-items: center; gap: 8px; }
  .lecture-count { font-size: 11px; color: #64748B; font-weight: 600; }
  .lecture-arrow { color: #64748B; font-size: 16px; transition: transform 0.2s; display: inline-block; }
  .lecture-arrow.open { transform: rotate(90deg); }

  .lecture-body {
    border: 1px solid #334155; border-top: none;
    border-radius: 0 0 10px 10px; background: #151D2E; padding: 8px;
  }

  .topic-btn {
    width: 100%; text-align: left; background: #1E293B; border: none;
    border-radius: 8px; padding: 10px 14px; cursor: pointer;
    color: #CBD5E1; font-size: 13px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
    font-family: inherit;
  }
  .topic-meta { font-size: 11px; color: #64748B; font-weight: 400; }

  .fact-card {
    border-radius: 8px; padding: 12px 14px; margin-bottom: 4px;
    cursor: pointer; transition: all 0.15s;
  }
  .fact-card.hidden { background: #192133; border-left: 3px solid #334155; }
  .fact-card.revealed { background: #1E293B; }
  .fact-question { font-size: 13px; font-weight: 600; color: #E2E8F0; line-height: 1.5; }
  .fact-answer {
    margin-top: 8px; font-size: 13px; color: #94A3B8; line-height: 1.7;
    padding-top: 8px; border-top: 1px solid #334155;
  }
  .fact-hint { font-size: 11px; color: #475569; margin-top: 4px; }

  .no-results { text-align: center; padding: 40px; color: #64748B; font-size: 14px; }

  /* Compare */
  .compare-intro { color: #94A3B8; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }

  .compare-table {
    margin-bottom: 16px; border: 1px solid #334155;
    border-radius: 10px; overflow: hidden;
  }
  .compare-title {
    background: #1E293B; padding: 12px 16px;
    font-weight: 700; font-size: 14px; color: #F1F5F9;
  }
  .compare-scroll { overflow-x: auto; }
  .compare-scroll table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .compare-scroll td {
    padding: 10px 12px; vertical-align: top; line-height: 1.5;
  }
  .compare-scroll tr { border-top: 1px solid #1E293B; }
  .compare-scroll td:first-child {
    color: #CBD5E1; font-weight: 600; background: #1E293B; width: 25%;
  }
  .compare-scroll td:not(:first-child) { color: #94A3B8; background: #151D2E; }
  .compare-scroll td:not(:last-child) { border-right: 1px solid #1E293B; }

  .traps { margin-top: 16px; padding: 16px; background: #1E293B; border-radius: 10px; border: 1px solid #334155; }
  .traps-title { font-size: 14px; font-weight: 700; color: #F8FAFC; margin-bottom: 10px; }
  .traps-body { font-size: 13px; color: #94A3B8; line-height: 1.8; }
  .traps-body .trap { margin-bottom: 8px; }
  .traps-body .trap:last-child { margin-bottom: 0; }
  .trap-label { color: #F59E0B; font-weight: 600; }

  .footer { text-align: center; padding: 24px 0 12px; color: #475569; font-size: 11px; }

  .lecture-wrap { margin-bottom: 8px; }
  .topic-wrap { margin-bottom: 6px; }
  .facts-list { padding: 4px 0; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>

      ]},
      { heading: "WSUS Deployment", facts: [
        { q: "How are WSUS clients configured?", a: "Via Group Policy (GPO for Windows Update). The GPO is linked to the OU containing the client computers." },
        { q: "Computer Groups?", a: "WSUS organizes clients into Computer Groups to control which updates are deployed to which computers." },
        { q: "How to force client detection?", a: "Run wuauclt.exe /detectnow /reportnow on the client to force it to report to WSUS and check for new updates." },
        { q: "Update approval process?", a: "Admin reviews updates → approves for specific computer groups → clients download and install approved updates." },
      ]},
    ]
  },
  {
    id: 9, title: "AD CS, PKI & EFS", lecture: "Lecture 9", color: "#14B8A6",
    topics: [
      { heading: "PKI & AD CS Overview", facts: [
        { q: "What is PKI?", a: "Public Key Infrastructure – a system of hardware, software, policies, and procedures that create, manage, and revoke digital certificates. Uses CAs to bind public keys with user identities." },
        { q: "What is AD CS?", a: "Active Directory Certificate Services – a server role for issuing and managing digital certificates as part of PKI." },
      ]},
      { heading: "AD CS Role Services", facts: [
        { q: "Certification Authority (CA)?", a: "Manages issuing, validating, and revoking certificates. Hierarchy of CAs provides HA and distributes workload." },
        { q: "Certificate Enrollment Web Service?", a: "Allows computers (Win7+) to connect to CA through web services. Acts as proxy to CA for downloading root certs, requesting/renewing certificates, retrieving CRLs." },
        { q: "Certificate Enrollment Policy Web Service?", a: "Enables retrieval of certificate enrollment policy information." },
        { q: "CA Web Enrollment?", a: "Provides certificate issuing/renewal for non-Windows devices, non-domain members, or devices not directly connected to the network." },
        { q: "Network Device Enrollment Service?", a: "Enables devices like routers and switches to obtain certificates from AD CS." },
        { q: "Online Responder?", a: "Manages OCSP validation and revocation checking." },
      ]},
      { heading: "Certificate Templates", facts: [
        { q: "What are Certificate Templates?", a: "Preconfigured rules and formats for certificate enrollment that simplify CA administration. Managed via Certificate Templates snap-in." },
        { q: "Version 2 templates?", a: "Introduced in Server 2003. Support auto-enrollment. Created automatically with CA role. Can be modified or used as a base." },
        { q: "Server 2016 supports how many template versions?", a: "Four template versions with different features." },
      ]},
      { heading: "EFS (Encrypting File System)", facts: [
        { q: "How EFS works?", a: "Uses public key to encrypt files. Only the encrypter's private key (or the EFS Recovery Agent's key) can decrypt. Private key is accessible ONLY to its owner." },
        { q: "EFS Recovery Agent?", a: "A designated account that can decrypt any EFS-encrypted file. Critical for organizations – prevents data loss if a user leaves or loses their key." },
      ]},
    ]
  },
  {
    id: 10, title: "AD FS & AD RMS", lecture: "Lecture 10", color: "#A855F7",
    topics: [
      { heading: "AD FS (Active Directory Federation Services)", facts: [
        { q: "What is AD FS?", a: "Enables Internet-facing B2B applications between organizations. Based on federation trusts. Allows SSO to apps/services in Azure, on-premises, or partner networks without multiple usernames/passwords." },
        { q: "AD FS is ___-based?", a: "Claims-based – provides a scalable authentication model for Internet-facing applications." },
        { q: "Claims-based Authentication?", a: "Users authenticate to AD and receive a claim/token. A trusted identity provider issues the token, which is presented to the relying party as proof of identity." },
        { q: "To implement claims-based auth, configure:", a: "A claims provider trust AND a relying party trust." },
        { q: "AD FS Configuration – two org types?", a: "Account organization (claim provider, contains user accounts – like trusted domain) and Resource organization (relying party, owns the resources – like trusting domain)." },
        { q: "Single organization?", a: "The organization is BOTH the account organization and resource organization." },
        { q: "Authentication Policies (Server 2012 R2+)?", a: "Define acceptable authentication mechanisms. Support multi-factor authentication for securing federation trust access." },
      ]},
      { heading: "AD RMS (Active Directory Rights Management Services)", facts: [
        { q: "What is AD RMS?", a: "Provides extra security to documents. Minimizes unauthorized data transmission/leakage. Keeps confidential info within the organization. Protects data at rest and in transit." },
        { q: "AD RMS integration?", a: "Integrates with Microsoft Exchange, SharePoint, and Office suite. Only works with AD RMS-aware applications." },
        { q: "AD RMS Client?", a: "Built into Windows 7 and later. Devices that are not AD RMS-aware CANNOT access protected content." },
        { q: "AD RMS Certificates & Licenses?", a: "Server Licensor Certificate (issued when deploying AD RMS cluster), Machine Certificate (identifies a computer/device), Rights Account Certificate (identifies a specific user), Publishing License (defines applied rights), End-user License (grants access to protected content), Client Licensor (enables user to publish protected content)." },
        { q: "AD RMS Template Properties?", a: "Content expiration, Use license expiration, Browser add-on viewing, Require new use license each time, Revocation policies." },
        { q: "AD RMS Backup?", a: "If VM: back up entire VM using Windows Backup with Hyper-V. If physical: back up entire machine including system state and all databases." },
      ]},
    ]
  },
  {
    id: 11, title: "Dynamic Access Control (DAC)", lecture: "Lecture 11", color: "#06B6D4",
    topics: [
      { heading: "DAC Overview", facts: [
        { q: "What is DAC?", a: "Dynamic Access Control (originally 'claims-based access control'). Available since Server 2012. Provides automatic mechanism to secure and control access using predefined expressions." },
        { q: "DAC Functionality?", a: "Apply access control based on: resource classification, device being used for access, and user-specific Active Directory attributes." },
        { q: "DAC vs traditional ACLs?", a: "Traditional: static, manual permissions per resource. DAC: dynamic, expression-based, automatic, real-time control using claims and resource properties." },
        { q: "DAC Components?", a: "Claim Types (AD attributes used for access decisions), Resource Properties (tags/classifications on files), Central Access Rules (expression-based access conditions), Central Access Policies (collections of rules deployed via GPO)." },
        { q: "How are Central Access Policies deployed?", a: "Through Group Policy (GPO) to file servers." },
      ]},
    ]
  }
];

// State
let activeTab = "overview";
let expandedLecture = null;
const expandedTopics = {};
const shownAnswers = {};
let searchQuery = "";

const totalFacts = studyData.reduce((sum, lec) =>
  sum + lec.topics.reduce((s, t) => s + t.facts.length, 0), 0);

document.getElementById("subtitle").textContent =
  `${studyData.length} lectures · ${totalFacts} key facts · MCQ ready`;

// Tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    document.getElementById("tab-" + activeTab).classList.add("active");
  });
});

function esc(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// Render Overview
function renderOverview() {
  const el = document.getElementById("tab-overview");
  let html = `<p style="color:#94A3B8;font-size:13px;margin-bottom:16px;line-height:1.6">
    How the unit fits together — each row is one lecture topic area. Tap any to jump to its study cards.
  </p>`;

  bigPictureMap.forEach(cat => {
    const tags = cat.items.map(item =>
      `<span class="overview-tag" style="background:${cat.color}18;color:${cat.color}">${esc(item)}</span>`
    ).join("");
    html += `<button class="overview-card" style="border-left:4px solid ${cat.color}" data-lec="${cat.lectures[0]}">
      <div class="overview-card-top">
        <div>
          <span class="overview-lec" style="color:${cat.color}">Lec ${cat.lectures[0]}</span>
          <div class="overview-title">${esc(cat.category)}</div>
        </div>
        <span class="overview-arrow">→</span>
      </div>
      <div class="overview-tags">${tags}</div>
    </button>`;
  });

  html += `<div class="big-picture">
    <div class="big-picture-title">Security Big Picture</div>
    <p class="big-picture-text">
      <span style="color:#10B981;font-weight:600">Authorized Access</span> = Availability via redundancy → DFS, NLB, Failover Clustering<br>
      <span style="color:#EF4444;font-weight:600">Unauthorized Access</span> = Prevention/restriction → EFS, AD RMS, GPO, DAC<br>
      <span style="color:#3B82F6;font-weight:600">Tools</span> = IPAM, GPMC, AD CS, AD FS, WSUS, NPS
    </p>
  </div>`;

  el.innerHTML = html;

  el.querySelectorAll(".overview-card").forEach(card => {
    card.addEventListener("click", () => {
      expandedLecture = parseInt(card.dataset.lec);
      document.querySelector('[data-tab="study"]').click();
      renderStudy();
    });
  });
}

// Render Study Cards
function renderStudy() {
  const el = document.getElementById("tab-study");
  const q = searchQuery.toLowerCase().trim();

  let data = studyData;
  if (q) {
    data = studyData.map(lec => ({
      ...lec,
      topics: lec.topics.map(topic => ({
        ...topic,
        facts: topic.facts.filter(f =>
          f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q)
        )
      })).filter(t => t.facts.length > 0)
    })).filter(lec => lec.topics.length > 0);
  }

  let html = `<div class="search-wrap">
    <input type="text" class="search-input" id="search-input"
      placeholder="Search any concept, keyword, or term..."
      value="${esc(searchQuery)}">
    <span class="search-icon">🔍</span>
  </div>`;

  if (data.length === 0) {
    html += `<div class="no-results">No results for "${esc(searchQuery)}". Try a different keyword.</div>`;
  } else {
    data.forEach(lec => {
      const isOpen = expandedLecture === lec.id;
      const factCount = lec.topics.reduce((s, t) => s + t.facts.length, 0);

      html += `<div class="lecture-wrap">
        <button class="lecture-btn${isOpen ? " open" : ""}" style="border-left:4px solid ${lec.color}" data-lid="${lec.id}">
          <div class="lecture-top">
            <div>
              <span class="lecture-lec" style="color:${lec.color}">${esc(lec.lecture)}</span>
              <div class="lecture-title">${esc(lec.title)}</div>
            </div>
            <div class="lecture-right">
              <span class="lecture-count">${factCount} cards</span>
              <span class="lecture-arrow${isOpen ? " open" : ""}">▶</span>
            </div>
          </div>
        </button>`;

      if (isOpen) {
        html += `<div class="lecture-body">`;
        lec.topics.forEach((topic, ti) => {
          const topicKey = `${lec.id}-${ti}`;
          const topicOpen = expandedTopics[topicKey] !== false;

          html += `<div class="topic-wrap">
            <button class="topic-btn" data-tkey="${topicKey}">
              <span>${esc(topic.heading)}</span>
              <span class="topic-meta">${topic.facts.length} Q&amp;A ${topicOpen ? "▾" : "▸"}</span>
            </button>`;

          if (topicOpen) {
            html += `<div class="facts-list">`;
            topic.facts.forEach((fact, fi) => {
              const factKey = `${lec.id}-${ti}-${fi}`;
              const revealed = !!shownAnswers[factKey];
              html += `<div class="fact-card ${revealed ? "revealed" : "hidden"}" style="${revealed ? "border-left:3px solid " + lec.color : ""}" data-fkey="${factKey}">
                <div class="fact-question">${esc(fact.q)}</div>
                ${revealed
                  ? `<div class="fact-answer">${esc(fact.a)}</div>`
                  : `<div class="fact-hint">Tap to reveal answer</div>`
                }
              </div>`;
            });
            html += `</div>`;
          }
          html += `</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
  }

  el.innerHTML = html;

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderStudy();
      const inp = document.getElementById("search-input");
      if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
    });
  }

  el.querySelectorAll(".lecture-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const lid = parseInt(btn.dataset.lid);
      expandedLecture = expandedLecture === lid ? null : lid;
      renderStudy();
    });
  });

  el.querySelectorAll(".topic-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.tkey;
      expandedTopics[key] = expandedTopics[key] === false ? true : false;
      renderStudy();
    });
  });

  el.querySelectorAll(".fact-card").forEach(card => {
    card.addEventListener("click", () => {
      const key = card.dataset.fkey;
      shownAnswers[key] = !shownAnswers[key];
      renderStudy();
    });
  });
}

// Render Compare
function renderCompare() {
  const el = document.getElementById("tab-compare");
  let html = `<p class="compare-intro">Side-by-side comparisons — the most MCQ-tested distinctions.</p>`;

  quickCompare.forEach(table => {
    html += `<div class="compare-table">
      <div class="compare-title">${esc(table.title)}</div>
      <div class="compare-scroll"><table><tbody>`;
    table.rows.forEach(row => {
      html += `<tr>`;
      row.forEach(cell => { html += `<td>${esc(cell)}</td>`; });
      html += `</tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  html += `<div class="traps">
    <div class="traps-title">MCQ Traps to Watch</div>
    <div class="traps-body">
      <div class="trap"><span class="trap-label">GPO order:</span> Local → Site → Domain → OU (last applied wins). Enforced GPOs override Block Inheritance.</div>
      <div class="trap"><span class="trap-label">IPAM server:</span> Must be domain member but CANNOT be a domain controller.</div>
      <div class="trap"><span class="trap-label">DA server:</span> Domain member but NOT a DC. Needs Windows Firewall on ALL profiles.</div>
      <div class="trap"><span class="trap-label">Forest trust:</span> Between forest ROOT domains only. Requires forest functional level 2003+.</div>
      <div class="trap"><span class="trap-label">NLB:</span> All hosts need STATIC IPs and same subnet. For STATELESS apps.</div>
      <div class="trap"><span class="trap-label">WSUS Autonomous vs Replica:</span> Autonomous = each admin approves. Replica = upstream approves, downstream follows.</div>
      <div class="trap"><span class="trap-label">AD RMS aware:</span> Only works with AD RMS-aware apps. Non-aware devices CANNOT access protected content.</div>
      <div class="trap"><span class="trap-label">AD FS:</span> Account org = claim provider (has users). Resource org = relying party (has resources).</div>
      <div class="trap"><span class="trap-label">BranchCache Distributed:</span> All clients must be on the SAME subnet.</div>
    </div>
  </div>`;

  el.innerHTML = html;
}

renderOverview();
renderStudy();
renderCompare();
</script>

</html>
