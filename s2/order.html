<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sweet Life Ice Cream Shop</title> 
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="./js/script.js"></script>
</head>
<body>
    <header>
        <h1>Sweet Life</h1> 

        <nav>
            <input type="checkbox" id="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
            <!-- Navigation links -->
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="order.html">Order</a></li>
                <li><a href="features.html">Features</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content: Order form -->
    <main>
        <form id="orderForm" method="POST" action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php">
            <!-- Form posts to a server-side script for processing -->

            <!-- Order Details Section -->
            <fieldset>
                <legend>Order Details</legend>

                <!-- Delivery or Pickup selection -->
                <label for="deliveryOption">Delivery or Pickup: *</label>
                <select id="deliveryOption" name="deliveryOption" required>
                  <option value="">--Please choose an option--</option> <!-- Placeholder -->
                  <option value="Delivery" id="delivery">Delivery</option>
                  <option value="Pickup" id="pickup">Pickup</option>
                </select>

                <!-- Section for delivery address; may be shown or hidden depending on choice -->
                <div id="deliveryAddressSection">
                  <label for="deliveryAddress">Delivery Address: *</label>
                  <textarea id="deliveryAddress" name="deliveryAddress" rows="3"></textarea>
                </div>

                <!-- Billing Address -->
                <label for="billingAddress">Billing Address: *</label>
                <!-- Checkbox to copy delivery address to billing address -->
                <input type="checkbox" id="sameAsDelivery"> Same as delivery address
                <!-- Billing address text area -->
                <textarea id="billingAddress" name="billingAddress" rows="3" required></textarea>

                <!-- Contact Number input -->
                <label for="contactNumber">Contact Number: *</label>
                <input type="tel" id="contactNumber" name="contactNumber" required>

                <!-- Email for receipt -->
                <label for="receiptEmail">Email for Receipt: *</label>
                <input type="email" id="receiptEmail" name="receiptEmail" required>
            </fieldset>

            <!-- Payment Details Section -->
            <fieldset>
                <legend>Payment Details</legend>

                <!-- Payment method selection -->
                <label for="paymentMethod">Payment Method: *</label>
                <select id="paymentMethod" name="paymentMethod" required>
                  <option value="">--Please choose an option--</option>
                  <option value="Pay on Pickup">Pay on Pickup</option>
                  <option value="Pay Online">Pay Online</option>
                </select>

                <!-- Credit Card Details Section - probably shown only if Pay Online is selected -->
                <div id="creditCardSection">
                  <label for="creditCardType">Credit Card Type: *</label>
                  <select id="creditCardType" name="creditCardType">
                    <option value="">--Please choose an option--</option>
                    <option value="Visa">Visa</option>
                    <option value="MasterCard">MasterCard</option>
                    <option value="American Express">American Express</option>
                  </select>

                  <!-- Credit Card Number input -->
                  <label for="creditCardNumber">Credit Card Number: *</label>
                  <input type="text" id="creditCardNumber" name="creditCardNumber">

                  <!-- Expiry date input (month picker) -->
                  <label for="expiryDate">Expiry Date: *</label>
                  <input type="month" id="expiryDate" name="expiryDate">

                  <!-- CVV input, limited to 3 characters -->
                  <label for="cvv">CVV: *</label>
                  <input type="text" id="cvv" name="cvv" maxlength="3">
                </div>
            </fieldset>

            <!-- Submit button to place order -->
            <button type="submit">Place Order</button>
        </form>
    </main>

    <!-- Footer with copyright -->
    <footer>
        <p>&copy; 2025 Sweet Life Ice Cream Shop. All rights reserved.</p>
    </footer>
</body>
</html>
